name: Capture project screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture.mjs'
      - '.github/workflows/capture-project-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Capture deployed projects
        run: node scripts/capture.mjs --go

      - name: Commit screenshots and project data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Ajoute les captures réelles des projets'
          file_pattern: 'public/assets/*.png src/data/projects.js'
